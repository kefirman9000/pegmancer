<title>Pegmancer</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140806">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Theme: darkly comic infernal bureaucracy — hellfire oranges, scorched blacks, sickly green. Layout: one-screen cabinet — HUD, item bar on top of the board, board canvas, live score + food/perk tray; overlays for title, market, cafe, claw, perks, game over */
:root{
  --bg:#140806; --panel:#261010; --panel2:#3a1612; --line:#5a2318;
  --fg:#fbe9dc; --muted:#c59a87; --gold:#ffb02e; --red:#ff3b2f; --blue:#ff7a2e; --teal:#9cff57; --good:#9cff57; --cursed:#c86bff;
  --display:'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden],.overlay[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(6px, env(safe-area-inset-left, 0px));padding-right:max(6px, env(safe-area-inset-right, 0px));padding-top:max(4px, env(safe-area-inset-top, 0px));padding-bottom:max(4px, env(safe-area-inset-bottom, 0px));gap:4px;overflow:hidden}
#hud{display:flex;flex-direction:column;gap:3px;flex:none;padding:0 2px}
#hud .row:first-child{gap:12px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.stat span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;white-space:nowrap}
.stat b{font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.gold b{color:var(--gold)}
.stat.life b{color:var(--red);letter-spacing:1px}
.spacer{flex:1}
.chipbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.chipbtn:disabled{opacity:.45}
.bar{position:relative;flex:1;min-width:0;height:18px;border-radius:9px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
#hGhost{position:absolute;inset:auto 0 0 0;height:0;background:repeating-linear-gradient(135deg,#ffb02e66 0 6px,#ffb02e33 6px 12px)}
#hBar{position:absolute;inset:auto 0 0 0;height:0;background:linear-gradient(0deg,#8a1a10,#ff3b2f);transition:height .35s ease}
#hBar.over{background:linear-gradient(0deg,#ffb02e,#9cff57);box-shadow:0 0 10px #9cff57aa}
#meter{flex:none;width:16px;display:flex;flex-direction:column;align-items:center;gap:4px;align-self:center}
#meter .bar{flex:1;width:14px;min-height:0;height:auto;border-radius:7px}
#hOver{font-size:10px;font-weight:800;color:var(--green,#9cff57);line-height:1;min-height:10px;white-space:nowrap}
#hScore{font-variant-numeric:tabular-nums}
#hDrops{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11px;color:var(--muted);font-weight:800;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--fg);box-shadow:0 0 6px #fff8}
.dot.used{background:transparent;border:2px solid var(--line);box-shadow:none}
#modRow{gap:6px;min-height:14px;font-size:11px;font-weight:800;line-height:14px}
#hMod{flex:1;min-width:0;color:var(--red);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;font-size:11px;font-weight:800}
#hMod.soon{color:var(--gold)}
.chipev{flex:none;max-width:46%;background:none;border:1px solid var(--line);border-radius:999px;padding:0 6px;font-size:10.5px;font-weight:800;line-height:14px;color:var(--acc,#ffb02e);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipev.done{color:#9cff57;border-color:#9cff57}
.perk.curse{color:#ff3b2f;border-color:#ff3b2f66}
/* item bar on top of the board */
#itemBar .it.frozen{opacity:.35;filter:grayscale(1);border-style:dashed}
#itemBar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;height:46px;flex:none;padding:0 1px}
#itemBar::-webkit-scrollbar{display:none}
/* relic tiles: square-ish, rarity-coloured bevel, big glyph, level pips */
.it{--rc:var(--line);position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border-radius:10px;border:2px solid var(--rc);background:var(--panel);
  background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 22%,var(--panel)) 0%,var(--panel) 60%,color-mix(in srgb,#000 30%,var(--panel)) 100%);
  box-shadow:inset 0 2px 0 #ffffff1a,inset 0 -3px 0 #0006,0 2px 0 #0008;color:var(--rc);font-weight:800;transition:transform .12s,box-shadow .12s,filter .12s}
.it .g{font-family:var(--display);font-size:17px;line-height:1;letter-spacing:.02em;text-shadow:0 1px 0 #000a}
.it .pips{display:flex;gap:3px}.it .pips i{width:5px;height:5px;border-radius:50%;background:#ffffff26}.it .pips i.on{background:var(--gold);box-shadow:0 0 4px var(--gold)}
.it .ct{position:absolute;top:1px;right:3px;font-size:8.5px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.it .burn{position:absolute;top:1px;left:3px;color:var(--teal);font-size:8.5px}
.it.fire{transform:translateY(-3px) scale(1.06);box-shadow:inset 0 2px 0 #ffffff33,0 0 14px var(--rc),0 4px 0 #0008;filter:brightness(1.35)}
.it.sel{outline:2px solid var(--fg);outline-offset:1px}
.it.empty{border-style:dashed;opacity:.4;color:var(--muted);background:none;box-shadow:none;font-size:16px}
.it.locked{opacity:.22;color:var(--muted);background:repeating-linear-gradient(135deg,#ffffff0d 0 4px,transparent 4px 8px);box-shadow:none;font-size:13px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4px;position:relative}
canvas{display:block;border-radius:10px;touch-action:none}
#liveRow{display:flex;align-items:center;gap:6px;height:30px;flex:none}
#live{flex:1;text-align:center;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;line-height:30px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#live br{display:none}
#live .x{color:var(--red)}
#live small{font-family:var(--body);font-size:11px;margin-left:6px;color:var(--muted);font-weight:700}
.book{display:flex;flex-direction:column;gap:5px;margin:8px 0;text-align:left}
.bk{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.bk .ic{flex:none;width:30px;height:30px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--muted)}
.bk .nm{font-weight:800;font-size:12.5px}.bk .ds{font-size:11px;color:var(--muted);line-height:1.3}
.bk.seen{opacity:.6}.bk.unseen{opacity:.35}
.interns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0 10px}
.intern{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px}
.intern b{font-size:12.5px}.intern small{font-size:11px;color:var(--muted);line-height:1.25}
.intern.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.intern.locked{opacity:.75}.intern:disabled{opacity:.4}
#fireBtn{flex:none;font-family:var(--display);font-size:18px;letter-spacing:.02em;background:linear-gradient(180deg,#ff6a00,#c0260f);color:#fff3c4;border:0;border-radius:11px;padding:6px 16px;box-shadow:0 3px 0 #6b1206,0 0 14px #ff6a0055;touch-action:none;-webkit-user-select:none;user-select:none}
#fireBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b1206}
#fireBtn.hot{background:linear-gradient(180deg,#fff3c4,#ff6a00);color:#2a0800;box-shadow:0 3px 0 #6b1206,0 0 22px #ff6a00}
#scrBtn{flex:none;font-family:var(--display);font-size:14px;background:var(--panel);color:var(--fg);border:1.5px solid var(--line);border-radius:9px;padding:4px 9px}
#bankBtn{font-family:var(--display);font-size:14px;background:var(--gold);color:#2a0a00;border:0;border-radius:9px;padding:5px 10px;box-shadow:0 3px 0 #8a3a00;white-space:nowrap}
#tray{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none;justify-content:safe center;height:28px;flex:none}
#tray::-webkit-scrollbar{display:none}
#tray:empty{display:none}
.food,.perk{flex:none;height:26px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;padding:0 8px;white-space:nowrap}
.food{border-color:#ffb36b;color:#ffcf9e}
.food.empty{border-style:dashed;opacity:.4;color:var(--muted);border-color:var(--line)}
.perk{border-color:#9cff57;color:#c9ff9e;border-radius:999px}
.key{color:var(--gold);font-weight:800;font-size:12px}
.sep{width:1px;height:20px;background:var(--line)}
#info{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;font-size:12.5px;color:var(--muted);text-align:center;display:flex;gap:6px 8px;justify-content:center;align-items:center;flex-wrap:wrap;line-height:1.3;background:#140806f2;border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 20px #000a}
#info:empty{display:none}
#info b{color:var(--fg)}
.overlay{position:fixed;inset:0;background:#0c0403ee;display:flex;justify-content:center;overflow-y:auto;z-index:20;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.card{width:100%;max-width:520px;margin:auto 0;display:flex;flex-direction:column;gap:12px}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,68px);line-height:.9;text-align:center;background:linear-gradient(180deg,#fff3c4 8%,#ffb02e 50%,#ff3b2f 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #4a0a05)}
.tag{text-align:center;color:var(--muted);font-weight:700;text-wrap:balance;font-size:14px}
h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-align:center;text-wrap:balance}
h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 0;font-weight:800}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.doors{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.door2{position:relative;text-align:left;border:2px solid var(--acc);border-radius:14px;padding:14px 14px 12px;color:var(--fg);background:linear-gradient(160deg,var(--d1),var(--d2));display:flex;flex-direction:column;gap:5px;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 30%,transparent),inset 0 0 40px #0006}
.door2 .dname{font-family:var(--display);font-size:24px;color:var(--acc)}.door2 .dflav{font-style:italic;color:var(--muted);font-size:12.5px}
.door2 .drule{font-size:12.5px}.door2 .dloot{font-size:11px;color:var(--muted)}
.door2:active{transform:scale(.98)}
.descent{position:relative;overflow:hidden;border-radius:16px;padding:34px 16px 22px;text-align:center;background:linear-gradient(180deg,var(--d1),var(--d2));border:2px solid var(--acc)}
.descent>*{position:relative}.descent .shaft{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 46px,color-mix(in srgb,var(--acc) 25%,transparent) 46px 48px);animation:shaft .35s linear infinite;opacity:.7}
@keyframes shaft{from{background-position:0 0}to{background-position:0 -96px}}
.descent .dsub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.descent .dbig{font-family:var(--display);font-size:40px;line-height:1;color:var(--acc);margin:10px 0 8px;text-shadow:0 0 18px var(--acc);animation:slam .7s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes slam{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.descent .dflav{font-style:italic;color:var(--fg);opacity:.85;animation:fadein .5s .9s both}.descent .drule{margin-top:10px;font-size:13px;animation:fadein .5s 1.2s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#stage.fallaway{animation:fallaway .8s ease-in forwards}@keyframes fallaway{to{transform:translateY(110vh) rotate(4deg);opacity:.3}}
#stage.arrive{animation:arrive .6s ease-out}@keyframes arrive{from{transform:translateY(-70vh)}to{transform:none}}
@media (prefers-reduced-motion:reduce){#stage.fallaway,#stage.arrive,.descent .shaft,.descent .dbig{animation:none}}
.big.pulse{animation:pulseBtn 1.1s ease-in-out infinite}
.big.alt{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2.5px var(--gold),0 4px 0 #0006}
@media (prefers-reduced-motion:reduce){.big.pulse{animation:none}}
.big{font-family:var(--display);font-size:20px;background:var(--gold);color:#2a0a00;border:0;border-radius:14px;padding:13px 18px;box-shadow:0 4px 0 #8a3a00}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #8a3a00}
.big:disabled{background:var(--panel2);color:var(--muted);box-shadow:none}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:center}
.pd{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.how{font-size:13.5px;line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.how p{margin:0 0 6px}.how p:last-child{margin:0}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{border-top:1px solid var(--line);padding-top:5px;margin-top:3px;font-weight:800;color:var(--gold)}
.offers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.offers.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.offer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left;position:relative}
.offer.frozen{border-color:#8fe3ff;box-shadow:inset 0 0 0 1px #8fe3ff55}
.offer .ic{width:36px;height:36px;border-radius:9px;border:2px solid;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px}
.offer .nm{font-weight:800;font-size:13.5px;line-height:1.15}
.offer .trig{font-size:11.5px;font-weight:800;color:var(--gold);line-height:1.25}
.offer .ds{font-size:12px;color:var(--muted);line-height:1.35;flex:1}
.offer .rar{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.offer .frz{position:absolute;top:8px;right:8px;font-size:11px;padding:3px 8px}
.buy{border:0;border-radius:9px;padding:8px;font-weight:800;background:var(--gold);color:#2a0a00}
.buy:disabled{background:var(--panel2);color:var(--muted)}
.offer.sold{opacity:.45}
.shoprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.next{text-align:center;font-weight:700;color:var(--muted);font-size:13.5px}
.next b{color:var(--fg)}.next .boss{color:var(--red)}
.sellbtn{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800}
.mvbtn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800}
.usebtn{background:var(--gold);border:0;color:#2a0a00;border-radius:8px;padding:4px 11px;font-size:12px;font-weight:800}
.ownbar{display:flex;gap:5px;flex-wrap:wrap}
.ownbar .it{width:46px;height:46px}.ownbar .it.trainable::after{content:'▲';position:absolute;top:1px;right:4px;font-size:9px;color:#9cff57}
.claw{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:46px 10px 12px;overflow:hidden}
.claw .rail{position:absolute;top:10px;left:10px;right:10px;height:4px;background:var(--line);border-radius:2px}
.claw .hand{position:absolute;top:4px;width:34px;margin-left:-17px;height:32px;display:flex;flex-direction:column;align-items:center}
.claw .hand i{width:4px;height:16px;background:var(--muted)}
.claw .hand b{width:28px;height:12px;border:3px solid var(--gold);border-top:0;border-radius:0 0 12px 12px}
.prizes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.prize{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(11px,3.4vw,16px);text-align:center;line-height:1}
.prize.got{background:#3b2f10;border-color:var(--gold);color:var(--gold)}
.prize.miss{opacity:.3}
.door{background:#1e0a26;border:1px solid var(--cursed);color:var(--cursed);border-radius:12px;padding:10px;font-weight:800}
@keyframes bump{0%{transform:scale(1.3)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.bump{animation:bump .4s ease-out}
@media (max-width:420px){.offers.three{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:17px}}
@media (max-height:700px){.stat b{font-size:16px}#itemBar{height:38px}.it .g{font-size:14px}.it .ct{display:none}#liveRow{height:26px}#live{font-size:17px;line-height:26px}}
@media (prefers-reduced-motion:reduce){#hBar{transition:none}.it{transition:none}.bump{animation:none}}
</style>

<div id="app">
  <header id="hud">
    <div class="row">
      <div class="stat"><span>Round</span><b id="hRound">1</b></div>
      <div class="stat"><span>Quota</span><b id="hScore">0/0</b></div>
      <div class="stat gold"><span>Coins</span><b id="hGold">0</b></div>
      <div class="stat life"><span>Chances</span><b id="hLives">♥♥♥</b></div>
      <div class="spacer"></div>
      <button class="chipbtn" id="hudExp" type="button">Export</button>
      <button class="chipbtn" id="muteBtn" type="button" aria-label="Toggle sound">♪ On</button>
    </div>
    <div class="row" id="modRow" hidden><button id="hEv" class="chipev" type="button" hidden></button><button id="hBounty" class="chipev" type="button" hidden></button><button id="hMod" type="button"></button></div>
  </header>
  <div id="itemBar" aria-label="Your items"></div>
  <div id="stage"><div id="meter" aria-hidden="true"><span id="hOver"></span><div class="bar"><div id="hGhost"></div><div id="hBar"></div></div><div id="hDrops"></div></div><canvas id="cv" aria-label="Board of Torment. Drag to aim the soul cannon, release to fire. Hold still to charge a Hellfire shot."></canvas><div id="info" role="status"></div></div>
  <div id="liveRow"><div id="live">&nbsp;</div><button id="scrBtn" type="button" hidden aria-label="Scramble the board">⟳ 1</button><button id="bankBtn" type="button" hidden>End round</button><button id="fireBtn" type="button" hidden>Launch</button></div>
  <div id="tray"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="ov" class="overlay" hidden><div class="card" id="ovCard"></div></div>

<script>
(()=>{
const W=400,H=660,PW=400,CX=200,CY=36,BARREL=30,SHOT=430,MAX_AIM=1.35,LX=381,LANE_TOP=98,HEAD_Y=626,ARC_R=13.5,ARC_CX=367.5,ARC_Y=80,DROP_Y=62,BT=598,NB=7,BW=PW/NB,BASE_R=7,FINAL=60,LAUNCH=320,MAX_ANG=1.05;

const evolvesInto=id=>EVOLVED.find(e=>e.from.includes(id));
function checkEvolve(){
  let n=0;for(const e of EVOLVED){const a=st.inv.findIndex(x=>x.id===e.from[0]&&x.L>=3),b=st.inv.findIndex(x=>x.id===e.from[1]&&x.L>=3);if(a<0||b<0)continue;
    const keep=Math.min(a,b),drop=Math.max(a,b);st.inv[keep]={id:e.id,L:1,paid:st.inv[a].paid+st.inv[b].paid,fired:0};st.inv.splice(drop,1);
    noteOwned(e.id);logEv('EVOLVED '+e.n);popup(W/2,200+44*n++,'EVOLUTION: '+e.n.toUpperCase(),'#ff4fd8',22,.35);flash('#ff4fd8',.3);chord([523,659,784,1046,1318]);burst(W/2,220,'#ff4fd8',60,320,3);flashT[keep]=performance.now()}
}

function layoutSlots(z,v=0){

// Claw machine
function showClaw(head,lines){
  const prizes=Array.from({length:6},()=>{const r=rnd();
    if(r<.38)return {k:'coins',v:3+Math.floor(rnd()*8)};
    if(r<.6)return {k:'food',v:pick(FOODS).id};
    if(r<.88)return {k:'item',v:(randomItem()||ITEMS[0]).id};
    if(r<.96)return {k:'key'};return {k:'perk'}});
  let grabs=3,pos=0,dir=1,raf=0,busy=false;const got=[];
  const label=p=>p.k==='coins'?p.v+'c':p.k==='food'?'Snack':p.k==='item'?'Relic':p.k==='key'?'Key':'Oath';
  showOv(`${sumHTML(head,lines)}<h2 style="font-size:24px">Soul Lottery</h2><div class="tag">Three tries. Stop the claw over a prize. It doesn't always hold on.</div>
   <div class="claw"><div class="rail"></div><div class="hand" id="hand"><i></i><b></b></div><div class="prizes" id="prz">${prizes.map((p,i)=>`<div class="prize" data-p="${i}">?</div>`).join('')}</div></div>
   <button class="big" id="grabBtn" type="button">Grab (3 left)</button><div class="next" id="clawMsg">&nbsp;</div>
   ${nextHTML()}<button class="big alt" id="contBtn" type="button" style="width:100%;margin-top:10px;font-size:22px;padding:15px 18px">Skip to round ${st.round+1} ›</button>`);
  const hand=$('hand'),prz=$('prz');
  const tick=()=>{if(ov.hidden||grabs<=0)return;pos+=dir*.012;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}hand.style.left=`calc(10px + ${pos} * (100% - 20px))`;raf=requestAnimationFrame(tick)};tick();
  $('grabBtn').onclick=()=>{
    if(busy||grabs<=0)return;busy=true;grabs--;
    const boxes=[...prz.children],hr=hand.getBoundingClientRect(),cx=hr.left+hr.width/2;
    const idx=boxes.findIndex(b=>{const r=b.getBoundingClientRect();return cx>=r.left-3&&cx<=r.right+3});
    const ok=idx>=0&&!boxes[idx].classList.contains('got')&&!boxes[idx].classList.contains('miss')&&rnd()<.68;
    let msg='';
    if(idx<0)msg='Nothing under the claw.';
    else if(!ok){if(!boxes[idx].classList.contains('got'))boxes[idx].classList.add('miss');boxes[idx].textContent=label(prizes[idx]);msg='It slipped out of the claw.'}
    else{const p=prizes[idx];boxes[idx].classList.add('got');boxes[idx].textContent=label(p);
      if(p.k==='coins'){st.coins+=p.v;msg=`+${p.v} coins`}
      else if(p.k==='food'){if(st.foods.length<st.foodSlots){st.foods.push(p.v);msg='Got '+FOODS.find(f=>f.id===p.v).n}else msg='Food tray full, so you left it.'}
      else if(p.k==='item'){if(gainItem(p.v,0))msg='Got '+IT[p.v].n;else{const c=Math.max(3,Math.round((RAR[IT[p.v].r].p||5)*priceMul()/2));st.coins+=c;msg='No room for '+IT[p.v].n+', pawned it for '+c+' coins'}}
      else if(p.k==='key'){st.keys++;msg='Got a Ledger Key. Use it at the next Commissary.'}
      else{const pk=shuffle(PERKS.filter(x=>!st.perks.includes(x.id)))[0];if(pk){st.perks.push(pk.id);if(pk.gain)pk.gain();msg='Perk: '+pk.n+'. '+pk.d}else{st.coins+=8;msg='+8 coins'}}
      got.push(msg);chord([660,880,990]);renderBar();renderTray();
    }
    logEv('claw: '+msg);$('clawMsg').textContent=msg;
    $('grabBtn').textContent=grabs?`Grab (${grabs} left)`:'Out of tries';$('grabBtn').disabled=!grabs;
    if(!grabs){const cb=$('contBtn');cb.textContent=`Start round ${st.round+1} ›`;cb.classList.remove('alt');cb.classList.add('pulse')}
    setTimeout(()=>busy=false,350);
  };
  $('contBtn').onclick=()=>{cancelAnimationFrame(raf);nextRound()};
}

function summaryText(){
  if(!st||!st.log)return '';
  const L=st.log,counts={};st.pegs.forEach(p=>{const k=p.kind||'empty';counts[k]=(counts[k]||0)+1});
  const o=[];
  o.push('PEGMANCER RUN SUMMARY');
  o.push(`Version ${VERSION} · started ${L.started}${L.ended?' · ended '+L.ended:''}`);
  o.push(`Hells: ${[0,1,2,3].map(z=>HELLS[(st.hells&&st.hells[z])||DEF_HELLS[z]].n).join(' → ')}`);
  o.push(`Curses: ${(st.curses||[]).map(k=>CURSES[k].n).join(', ')||'none'} · patience ${st.patience||0}/100`);
  o.push(`Contract: ${(VARIANTS.find(v=>v.id===st.variant)||VARIANTS[0]).n} · seed ${st.seed}${st.daily?' · daily run '+st.daily:''}`);
  o.push(st.phase==='over'?`Result: out of lives on round ${st.round}`:`Status: round ${st.round} (${hellOf(st.round).n}), ${fmtInt(st.roundScore)} / ${fmtInt(st.tgt)}, ${st.dropsLeft} drops left`);
  o.push(`Lives ${st.lives}/${st.maxLives} · coins ${st.coins} · keys ${st.keys} · restocks this run ${st.restocksRun} · best drop ${fmtInt(st.bestDrop)}`);
  o.push(`Items (${st.inv.length}/${st.slots}, left to right): ${st.inv.map(x=>`${IT[x.id].n} ×${x.L} [fired ${x.fired||0}]`).join(', ')||'none'}`);

  o.push(`Food tray: ${st.foods.map(id=>FOODS.find(f=>f.id===id).n).join(', ')||'empty'}`);
  o.push(`Board: ${Object.entries(counts).map(([k,v])=>k+' '+v).join(', ')} · total value ${fmtInt(boardTotal())} · biggest peg ${fmtInt(maxPeg())}`);
  o.push(`Upgrades: outer buckets +${st.perm.edge}, red pegs +${st.perm.red}`);
  o.push('');o.push('ROUNDS');
  const rounds=[...new Set(L.drops.map(d=>d.r).concat(L.rounds.map(r=>r.r),L.events.map(e=>e.r)))].sort((a,b)=>a-b);
  for(const r of rounds){
    const R=L.rounds.find(x=>x.r===r);
    o.push(R?`Round ${r}${R.mod?' ['+R.mod+']':''}: ${fmtInt(R.score)} / ${fmtInt(R.target)} in ${R.dropsUsed}/${R.dropsMax} drops, ${R.won?'won':'MISSED'}, ${R.restocks} restocks, coins after ${R.coinsAfter}, lives ${R.lives}`:`Round ${r}: in progress`);
    L.drops.filter(d=>d.r===r).forEach(d=>o.push(`  drop ${d.d}: ${fmt(d.pts)} pts × ${fmt(d.mult)} mult × ${fmt(d.bucket)} = ${fmtInt(d.score)} (${d.hits} hits, ${d.pops} pops, aim ${d.pow}°${d.hell?', HELLFIRE':''})${d.tags.length?' ['+d.tags.join(', ')+']':''}`));
    L.events.filter(e=>e.r===r).forEach(e=>o.push('  · '+e.e));
  }
  o.push('');o.push('DATA (for changes)');
  o.push(JSON.stringify({v:VERSION,round:st.round,lives:st.lives,coins:st.coins,inv:st.inv.map(x=>[x.id,x.L,x.fired||0]),perks:st.perks,foods:st.foods,specials:st.specials,perm:st.perm,board:counts,rounds:L.rounds,drops:L.drops.map(d=>[d.r,d.d,d.pts,d.mult,d.bucket,d.hits,d.pops,d.score])}));
  return o.join('\n');
}

// ---------- physics ----------
function collide(b,p,pr,r){
  const dx=b.x-p.x,dy=b.y-p.y,rr=r+pr,d2=dx*dx+dy*dy;
  if(d2>=rr*rr||d2===0)return false;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
  b.x=p.x+nx*rr;b.y=p.y+ny*rr;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    const e=p.kind==='bumper'?1.25:.5;
    b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;b.vx+=(rnd()-.5)*24;
    if(Math.abs(nx)<.08)b.vx+=(rnd()<.5?-1:1)*40;
    if(p.kind==='bumper')b.vy-=40;
  }
  return true;
}
const posts=[];for(let i=1;i<NB;i++)posts.push({x:i*BW,y:BT,kind:'post'});
const pegR=p=>p.kind==='num'?8+Math.min(4,Math.log2(p.v+1)*.6):p.kind==='chest'?11:p.kind==='gem'?9:8;
function step(dt){
  const g=gravity(),r=ballR(),mag=has('magnet');
  let big=null;if(mag){let m=0;for(const p of st.pegs)if(p.kind==='num'&&p.v>m){m=p.v;big=p}}
  for(const b of balls){
    if(!b.alive)continue;
    b.t+=dt;b.vy+=g*dt;const nowT=performance.now();
    if(rule('wind'))b.vx+=windNow(nowT)*dt;
    if(rule('well')){const w=wellPos(nowT),dx=w.x-b.x,dy=w.y-b.y,d2=dx*dx+dy*dy+900;const a=2.2e6/d2;if(d2<90000){const d=Math.sqrt(d2);b.vx+=dx/d*Math.min(900,a)*dt;b.vy+=dy/d*Math.min(900,a)*dt}}
    if(rule('mirror')&&!b.mirrored&&b.px!=null&&b.y>DROP_Y+40&&b.y<BT&&(b.px-W/2)*(b.x-W/2)<0){b.mirrored=true;spawn(W-b.x,b.y,-b.vx,b.vy);const nb=balls[balls.length-1];if(nb&&nb!==b){nb.mirrored=true;nb.fire=b.fire||0}burst(b.x,b.y,'#ff8ae6',12,180);blip(1100,.08,'triangle')}
    b.px=b.x;
    if(big){const dx=big.x-b.x,dy=big.y-b.y,d=Math.hypot(dx,dy);if(d>1&&d<160){b.vx+=dx/d*260*dt}}
    const sp=Math.hypot(b.vx,b.vy);if(sp>950){b.vx*=950/sp;b.vy*=950/sp}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<r){b.x=r;b.vx=Math.abs(b.vx)*.7;wallHit(b)}
    if(b.x>PW-r){b.x=PW-r;b.vx=-Math.abs(b.vx)*.7;wallHit(b)}
    if(b.y<r&&b.vy<0){b.y=r;b.vy=Math.abs(b.vy)*.5}
    if(b.ghost>0)b.ghost-=dt;
    if(b.y<BT&&!(b.ghost>0)){for(const p of st.pegs){if(!p.kind||p.off)continue;
      if((p.kind==='num'&&p.v<=1)||p.kind==='portal'){const rr=pegR(p)+r;if((b.x-p.x)**2+(b.y-p.y)**2<rr*rr)hitPeg(p,b);continue}
      if(collide(b,p,pegR(p),r))hitPeg(p,b)}}
    for(const p of posts)collide(b,p,4,r);
    if(b.pcd>0)b.pcd-=dt;if(b.bcd>0)b.bcd-=dt;
    if(st.boss&&st.boss.hp>0&&collide(b,st.boss,st.boss.r,r)&&!(b.bcd>0)){b.bcd=.2;hurtBoss(b.fire>0?3:1,null);blip(160,.08,'square',.05)}
    if(st.imps)for(const im of st.imps)if(im.hp>0&&Math.hypot(b.x-(im.dx??im.x),b.y-(im.dy??im.y))<r+9)slayImp(im,b);
    if(st.bones&&st.bones.length)for(const bn of st.bones)if(collide(b,bn,5,r)&&!bn.cd){bn.cd=.15;fire('bone',{ball:b,bone:bn});blip(260,.04,'sine')}
    if(b.y>=BT){
      if(b.bin<0)b.bin=Math.max(0,Math.min(NB-1,Math.floor(b.x/BW)));
      const lo=b.bin*BW+r,hi=(b.bin+1)*BW-r;
      if(b.x<lo){b.x=lo;b.vx=Math.abs(b.vx)*.5}if(b.x>hi){b.x=hi;b.vx=-Math.abs(b.vx)*.5}
    }
    if(sp<18)b.still+=dt;else b.still=0;
    if(b.still>1.2){b.vx=(rnd()<.5?-1:1)*140;b.vy=-120;b.still=0}
    // wedge check: a soul pinned between a peg and a wall keeps jittering, so also watch whether it has
    // actually gone anywhere. If it hasn't moved 12px in 0.7s, push it toward the middle and let it slip
    // through pegs for a moment; longer each time it gets stuck again.
    if(b.y<BT){if(b.ax==null){b.ax=b.x;b.ay=b.y;b.at=0}b.at+=dt;
      if(b.at>=.7){if(Math.hypot(b.x-b.ax,b.y-b.ay)<12){b.stuck=(b.stuck||0)+1;b.vx=(b.x<W/2?1:-1)*(180+40*b.stuck);b.vy=Math.max(b.vy,60);b.ghost=Math.min(1,.25*b.stuck);b.still=0}b.ax=b.x;b.ay=b.y;b.at=0}}
    if(b.y>H-r-2||b.t>25)landBall(b);
  }
}
function wallHit(b){
  if(!D||b.t-b.lastWall<.15)return;b.lastWall=b.t;D.walls++;
  const c={ball:b};fire('wall',c);fireEvery('wallN',D.walls,c);
  if(hasPerk('rebound'))forceTrigger('last',1,c);

// ---------- input: drag to aim the cannon, release to fire, hold still to charge ----------
function boardPt(e){const rc=cv.getBoundingClientRect();return {x:(e.clientX-rc.left)/scale,y:(e.clientY-rc.top)/scale}}
function aimAt(pt){const dx=pt.x-CX,dy=Math.max(8,pt.y-CY);aimAng=Math.max(-MAX_AIM,Math.min(MAX_AIM,Math.atan2(dx,dy)))}

let aiming=false;
const canAim=()=>st&&st.log&&st.phase==='aim'&&ov.hidden;
cv.addEventListener('pointerdown',e=>{
  initAudio();if(sel){sel=null;renderBar();renderInfo()}if(!canAim())return;
  if(e.pointerType==='mouse'){aimAt(boardPt(e));if(e.button!==0)return;dragging=true;chargeStart=performance.now()}
  else{aiming=true;lastTouch={x:e.clientX,t:performance.now()};touchStart={x:e.clientX,y:e.clientY,moved:false};dragging=true;chargeStart=performance.now()}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
// touch aiming is relative: swipe sideways to swing the cannon. A slow drag of about
// 150px sweeps the whole range; faster swipes are accelerated up to 3x.
const AIM_SENS={precise:.6,normal:1,fast:1.6};let lastTouch=null;
function touchAim(e){
  const now=performance.now(),dx=e.clientX-lastTouch.x,dt=Math.max(1,now-lastTouch.t);lastTouch={x:e.clientX,t:now};
  const speed=Math.abs(dx)/dt,accel=1+Math.min(2,Math.max(0,speed-.15)*2.2);
  aimAng=Math.max(-MAX_AIM,Math.min(MAX_AIM,aimAng+dx*(2*MAX_AIM/150)*(AIM_SENS[meta.aimSens]||1)*accel));
}
let touchStart=null;
cv.addEventListener('pointermove',e=>{if(!canAim())return;if(e.pointerType==='mouse'){aimAt(boardPt(e));return}
  if(!aiming||!lastTouch)return;
  // once the finger slides more than a few pixels it's an aim, not a tap: stop charging
  if(touchStart&&!touchStart.moved&&Math.hypot(e.clientX-touchStart.x,e.clientY-touchStart.y)>9){touchStart.moved=true;dragging=false;lastTouch={x:e.clientX,t:performance.now()};return}
  if(touchStart&&touchStart.moved)touchAim(e)});
cv.addEventListener('pointerup',e=>{aiming=false;
  const tap=e.pointerType!=='mouse'&&touchStart&&!touchStart.moved;touchStart=null;
  if((e.pointerType==='mouse'||tap)&&dragging&&canAim()){const ch=chargeNow();dragging=false;tryDrop(1,ch)}dragging=false});
cv.addEventListener('pointercancel',()=>{aiming=false;dragging=false;touchStart=null});
const fireBtn=$('fireBtn');
fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(!canAim())return;dragging=true;chargeStart=performance.now();try{fireBtn.setPointerCapture(e.pointerId)}catch(_){}});
fireBtn.addEventListener('pointerup',()=>{if(dragging&&canAim()){const ch=chargeNow();dragging=false;tryDrop(1,ch)}dragging=false;fireBtn.classList.remove('hot')});
fireBtn.addEventListener('pointercancel',()=>{dragging=false;fireBtn.classList.remove('hot')});
fireBtn.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(!st||!st.log||!ov.hidden||st.phase!=='aim')return;
  if(e.key==='ArrowLeft'){aimAng=Math.min(MAX_AIM,aimAng+.04)}if(e.key==='ArrowRight'){aimAng=Math.max(-MAX_AIM,aimAng-.04)}
